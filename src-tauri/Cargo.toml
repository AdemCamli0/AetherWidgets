[package]
name = "aetherwidgets"
version = "0.1.0"
description = "Modern, lightweight desktop widgets for Windows"
authors = ["ademc"]
license = "MIT"
repository = "https://github.com/ademc/AetherWidgets"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aetherwidgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
